cradle:
  cabal:
    - path: "./cli/app/Main.hs"
      component: "blog-cli:exe:blog"

    - path: "./lib/src"
      component: "lib:blog-lib"

    - path: "./server/src"
      component: "lib:blog-server"

    - path: "./server/app/Main.hs"
      component: "blog-server:exe:blog-server"

    - path: "./server/app/Blog/Route.hs"
      component: "blog-server:exe:blog-server"

    - path: "./server/app/Blog/Rules.hs"
      component: "blog-server:exe:blog-server"

    - path: "./server/app/Blog/Time.hs"
      component: "blog-server:exe:blog-server"

    - path: "./server/test"
      component: "blog-server:test:blog-server-tests"
