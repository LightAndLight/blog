cradle:
  cabal:
    - path: "./src"
      component: "lib:blog"

    - path: "./cli/Main.hs"
      component: "blog:exe:blog"

    - path: "./server-lib"
      component: "blog:lib:blog-server-lib"

    - path: "./server/Main.hs"
      component: "blog:exe:blog-server"

    - path: "./server/Blog/Build.hs"
      component: "blog:exe:blog-server"

    - path: "./server/Blog/Diagnostic.hs"
      component: "blog:exe:blog-server"

    - path: "./server/Blog/Error.hs"
      component: "blog:exe:blog-server"

    - path: "./server/Blog/Metadata.hs"
      component: "blog:exe:blog-server"

    - path: "./server/Blog/Pandoc.hs"
      component: "blog:exe:blog-server"

    - path: "./server/Blog/Route.hs"
      component: "blog:exe:blog-server"

    - path: "./server/Blog/Rules.hs"
      component: "blog:exe:blog-server"

    - path: "./server/Blog/Store.hs"
      component: "blog:exe:blog-server"

    - path: "./test"
      component: "blog:test:blog-server-tests"
